name: pipeline

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      version-prefix:
        type: string
        required: true
      channel-tag:
        type: string
        required: true
      sha-tag-prefix:
        type: string
        required: true
      extra-tags:
        type: string
        default: ""
      prerelease:
        type: boolean
        default: false

env:
  NODE_VERSION: "24"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: llmhub
          POSTGRES_PASSWORD: llmhub
          POSTGRES_DB: llmhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U llmhub -d llmhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://llmhub:llmhub@localhost:5432/llmhub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Check schema drift
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema --exit-code
      - run: npm test
      - run: npm run test:integration
      - run: npm run i18n:check
      - run: npm run styles:check
      - run: npm run heroui:check
      - run: npx tsc --noEmit
      - run: npm run lint

  image:
    needs: [quality]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: inputs.publish
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version
        id: version
        env:
          VERSION_PREFIX: ${{ inputs.version-prefix }}
        run: |
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          version="${VERSION_PREFIX}$(date -u +%Y.%m.%d).${short_sha}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.channel-tag }}
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ inputs.sha-tag-prefix }}${{ steps.version.outputs.short_sha }}
            ${{ inputs.extra-tags }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          push: ${{ inputs.publish }}
          platforms: ${{ inputs.publish && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ID=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Publish GitHub release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          CHANNEL_TAG: ${{ inputs.channel-tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists"
            exit 0
          fi
          kind="release"
          set --
          if [ "${PRERELEASE}" = "true" ]; then
            kind="prerelease"
            set -- --prerelease
          fi
          body="$(printf '%s\n\n## Container\n\n```text\n%s:%s\n%s:%s\n%s@%s\n```\n' \
            "Automated ${kind} from \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\`." \
            "${IMAGE}" \
            "${CHANNEL_TAG}" \
            "${IMAGE}" \
            "${VERSION}" \
            "${IMAGE}" \
            "${DIGEST}")"
          gh release create "${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "${VERSION}" \
            --notes "${body}" \
            --generate-notes \
            "$@"

  scan:
    needs: [image]
    if: inputs.publish
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.image.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: container-image
