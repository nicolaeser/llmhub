name: pipeline

on:
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      publish:
        type: boolean
        default: false
    outputs:
      version:
        value: ${{ jobs.version.outputs.version }}
      prerelease:
        value: ${{ jobs.version.outputs.prerelease }}
      tags:
        value: ${{ jobs.version.outputs.tags }}

env:
  NODE_VERSION: "24"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tags: ${{ steps.version.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Version
        id: version
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          case "${CHANNEL}" in
            main)
              VERSION_PREFIX=v
              prerelease=false
              aliases=(latest "sha-${short_sha}" "sha-${GITHUB_SHA}")
              ;;
            development)
              VERSION_PREFIX=dev-
              prerelease=true
              aliases=(dev development "dev-${short_sha}")
              ;;
            *)
              echo "Unknown channel ${CHANNEL}" >&2
              exit 1
              ;;
          esac
          version="${VERSION_PREFIX}$(date -u +%Y.%m.%d).${short_sha}"
          {
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "tags=$(printf '%s\n' "${version}" "${aliases[@]}" | jq -Rnc '[inputs]')"
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=${{ steps.version.outputs.version }}

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: llmhub
          POSTGRES_PASSWORD: llmhub
          POSTGRES_DB: llmhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U llmhub -d llmhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://llmhub:llmhub@localhost:5432/llmhub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Check schema drift
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema --exit-code
      - run: npm test
      - run: npm run test:integration
      - run: npm run i18n:check
      - run: npm run styles:check
      - run: npm run heroui:check
      - run: npx tsc --noEmit
      - run: npm run lint

  image:
    name: image (${{ matrix.arch }})
    needs: [version, quality]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      BUILD_ID: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: inputs.publish
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: ${{ inputs.publish && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_NAME) || 'type=docker,name=llmhub:verify' }}
          labels: ${{ needs.version.outputs.labels }}
          build-args: |
            BUILD_ID=${{ env.BUILD_ID }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
          provenance: ${{ inputs.publish }}
          sbom: ${{ inputs.publish }}

      - name: Smoke test
        env:
          IMAGE_REF: ${{ inputs.publish && format('{0}/{1}@{2}', env.REGISTRY, env.IMAGE_NAME, steps.build.outputs.digest) || 'llmhub:verify' }}
        run: scripts/smoke-image.sh "${IMAGE_REF}" "${BUILD_ID}"

      - name: Export digest
        if: inputs.publish
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        if: inputs.publish
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
