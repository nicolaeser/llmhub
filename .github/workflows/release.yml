name: release

on:
  push:
    branches:
      - main
      - development

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    uses: ./.github/workflows/pipeline.yml
    permissions:
      contents: read
      packages: write
    with:
      channel: ${{ github.ref_name }}
      publish: true

  publish:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAGS: ${{ needs.build.outputs.tags }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish manifest
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r --arg image "${IMAGE}" '.[] | "--tag=\($image):\(.)"' <<<"${TAGS}")
          mapfile -t sources < <(printf "${IMAGE}@sha256:%s\n" *)
          if [ "${#sources[@]}" -ne 2 ]; then
            echo "Expected 2 platform digests, got ${#sources[@]}" >&2
            exit 1
          fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists"
            exit 0
          fi
          kind="release"
          set --
          if [ "${PRERELEASE}" = "true" ]; then
            kind="prerelease"
            set -- --prerelease
          fi
          body="$(
            printf 'Automated %s from `%s` on `%s`.\n\n## Container\n\n```text\n' "${kind}" "${GITHUB_SHA}" "${GITHUB_REF_NAME}"
            jq -r --arg image "${IMAGE}" '.[] | "\($image):\(.)"' <<<"${TAGS}"
            printf '%s@%s\n```\n' "${IMAGE}" "${DIGEST}"
          )"
          gh release create "${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "${VERSION}" \
            --notes "${body}" \
            --generate-notes \
            "$@"

  scan:
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      packages: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: container-image
