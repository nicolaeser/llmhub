name: development

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

permissions:
  contents: read

concurrency:
  group: development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pipeline.yml
    permissions:
      contents: read
    with:
      version-prefix: dev-
      channel-tag: dev
      sha-tag-prefix: dev-
      extra-tags: type=raw,value=development

  release:
    if: github.event_name == 'push'
    uses: ./.github/workflows/pipeline.yml
    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read
    with:
      publish: true
      prerelease: true
      version-prefix: dev-
      channel-tag: dev
      sha-tag-prefix: dev-
      extra-tags: type=raw,value=development
