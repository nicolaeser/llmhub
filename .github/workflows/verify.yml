name: verify

on:
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/pipeline.yml
    permissions:
      contents: read
    with:
      channel: ${{ github.base_ref }}
