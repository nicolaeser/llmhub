name: main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pipeline.yml
    permissions:
      contents: read
    with:
      version-prefix: v
      channel-tag: latest
      sha-tag-prefix: sha-
      extra-tags: type=sha,format=long

  release:
    if: github.event_name == 'push'
    uses: ./.github/workflows/pipeline.yml
    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read
    with:
      publish: true
      version-prefix: v
      channel-tag: latest
      sha-tag-prefix: sha-
      extra-tags: type=sha,format=long
