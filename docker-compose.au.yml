x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    labels:
      llmhub.updater.target: "true"

  keeper:
    labels:
      llmhub.updater.target: "true"

  updater:
    image: ghcr.io/nicolaeser/llmhub:${LLMHUB_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - app
    command: ["node", "updater.mjs"]
    user: "0:0"
    environment:
      APP_SECRET: ${APP_SECRET}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "node", "updater.mjs", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: 256m
    logging: *logging
