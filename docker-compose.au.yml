services:
  app:
    labels:
      llmhub.updater.target: "true"

  updater:
    image: ghcr.io/nicolaeser/llmhub:${LLMHUB_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - app
    user: "0:0"
    command: ["node", "updater.mjs"]
    env_file:
      - .env
    environment:
      LLMHUB_UPDATER_APP_URL: http://app:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "node", "updater.mjs", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
